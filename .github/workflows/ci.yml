name: CI

# בדיקות ובנייה בלבד. הפריסה *לא* קורית כאן.
#
# למה: שלב actions/deploy-pages על האתר הזה חרג דרך קבע מהטיימאאוט שלו —
# הארטיפקט כולל 32MB של סרטוני הדגמה — ואז ביטל את הפריסה והשאיר את האתר על
# גרסה ישנה. הפריסה עברה ל-`npm run deploy`, שדוחף את תוצר הבנייה לענף
# gh-pages ש-Pages מגיש ממנו. הריצה כאן היא רשת ביטחון: היא תופסת שבירה
# שנדחפה בלי להריץ בדיקות מקומית.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # .nvmrc ולא מספר קשיח — כך CI והמכונה המקומית מריצים את אותו Node,
          # ואזהרות שמופיעות פה מופיעות גם שם
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ה-lint לפני הכל: הוא רץ בשניות, ו-rules-of-hooks תופס משפחת באגים
      # ש-tsc לא רואה בכלל (הוק בתוך תנאי)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # חריגה מתקרת 4MB לקובץ ב-workbox משמיטה אותו מה-precache *בשקט*
      # ושוברת אופליין. תיל מעידה, לא אופטימיזציה.
      - run: npm run check:size

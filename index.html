         רגילה, ולכן יש גם touch-action ב-CSS וחסימת gesture ב-JS -->

      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <meta name="mobile-web-app-capable" content="yes" />

         מאחור האייקון פשוט חסר — קיצור שנראה כמו ריבוע אפור באייפון -->
